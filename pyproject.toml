[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-forge"
version = "0.1.0"
description = "Fable 5 の思考パターンで高品質な長編小説を完成させる小説生成アプリ"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
novel-forge = "novel_forge.cli:main"
bb-theater = "bb_theater.cli:main"

[tool.setuptools.packages.find]
include = ["novel_forge*", "bb_theater*"]

[tool.setuptools.package-data]
novel_forge = ["static/*"]
bb_theater = ["static/*"]
